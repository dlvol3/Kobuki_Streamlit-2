<div class="drivers">
  <section class="driver price">
    <div class="driver-name">Price per can</div>
    <div class="driver-unit">EUR / can</div>
    <output id="price-readout">€5.1000</output>
    <div class="vertical-track">
      <span class="top-label" id="price-max">€6.63</span>
      <input type="range" id="price-range" aria-label="Price per can" min="4.08" max="6.63" step="0.001" value="5.1" />
      <span class="bottom-label" id="price-min">€4.08</span>
    </div>
    <label class="exact-label" for="price-number">Price · EUR/can</label>
    <input class="exact-number" id="price-number" aria-label="Exact price per can" type="number" min="4.08" max="6.63" step="0.001" value="5.1" />
  </section>
  <section class="driver costs">
    <div class="driver-name">Fixed costs</div>
    <div class="driver-unit">flat change / year</div>
    <output id="cost-readout">€0</output>
    <div class="vertical-track">
      <span class="top-label" id="cost-max">+€600k</span>
      <input type="range" id="cost-range" aria-label="Annual fixed cost change" min="-240000" max="600000" step="1000" value="0" />
      <span class="bottom-label">−€240k</span>
    </div>
    <label class="exact-label" for="cost-number">Change · EUR/year</label>
    <input class="exact-number" id="cost-number" aria-label="Exact annual fixed cost change" type="number" min="-240000" max="600000" step="1000" value="0" />
  </section>
</div>
<p class="driver-note">Fixed-cost changes are relative to Q1 (€240,000/year). Q2 uses −€20,000, giving €220,000/year.</p>
